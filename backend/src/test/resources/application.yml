spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://127.0.0.1:3307/bank_forecast_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${TEST_DB_USERNAME:bank_forecast}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # 测试库为共享 MySQL，每个 Spring 上下文启动时清空重建，保持与原有内存库一致的隔离语义
    clean-disabled: false

bank-forecast:
  analytics:
    base-url: http://localhost:8001
    connect-timeout-ms: 200
    read-timeout-ms: 500
  bootstrap:
    default-admin-password: test-password-123
  security:
    jwt-secret: unit-test-token-secret
    access-token-ttl-minutes: 120
  import:
    max-rows: 10000
    max-file-size-bytes: 10485760
    max-date-range-days: 3650
    max-amount: 1000000000000.00
    customer-name-min-length: 2
    customer-name-allow-contains: true
