spring:
  datasource:
    url: jdbc:h2:mem:bank_connector_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false

bank-forecast:
  analytics:
    base-url: http://localhost:8001
    connect-timeout-ms: 200
    read-timeout-ms: 500
  bootstrap:
    default-admin-password: test-password-123
  security:
    jwt-secret: unit-test-token-secret
    access-token-ttl-minutes: 120
  import:
    max-rows: 10000
    max-file-size-bytes: 10485760
    max-date-range-days: 3650
    max-amount: 1000000000000.00
    customer-name-min-length: 2
    customer-name-allow-contains: true
