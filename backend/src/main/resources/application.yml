spring:
  application:
    name: bank-forecast-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/bank_connector;MODE=MySQL;DATABASE_TO_UPPER=false}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

bank-forecast:
  analytics:
    base-url: ${ANALYTICS_BASE_URL:http://localhost:8001}
    connect-timeout-ms: ${ANALYTICS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ANALYTICS_READ_TIMEOUT_MS:10000}
  bootstrap:
    default-admin-password: ${DEV_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:5173,http://localhost:5174}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:120}
  import:
    max-rows: ${IMPORT_MAX_ROWS:10000}
    max-file-size-bytes: ${IMPORT_MAX_FILE_SIZE_BYTES:10485760}
    max-date-range-days: ${IMPORT_MAX_DATE_RANGE_DAYS:3650}
    max-amount: ${IMPORT_MAX_AMOUNT:1000000000000.00}
    customer-name-min-length: ${MATCH_CUSTOMER_NAME_MIN_LENGTH:2}
    customer-name-allow-contains: ${MATCH_CUSTOMER_NAME_ALLOW_CONTAINS:true}
  attachment:
    storage-root: ${ATTACHMENT_STORAGE_ROOT:./data/attachments}
