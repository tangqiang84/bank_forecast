[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-forecast-analytics"
version = "0.1.0"
description = "Bank forecast analytics service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx2>=0.1.0"]

[project.scripts]
bank-forecast-analytics = "bank_forecast_analytics.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
